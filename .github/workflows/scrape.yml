name: Bybit P2P USDT-NGN snapshot

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_bybit_p2p.py
      - name: Commit data
        run: |
          git config user.name "p2p-bot"
          git config user.email "p2p-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "snapshot $(date -u +'%F %H:%M')" && git pull --rebase && git push)
